en:
  theme_metadata:
    description: "Adds configurable featured content sections to the BakersClub homepage, with separate cards and group visibility."

    settings:
      featured_sections:
        description: "Create and reorder homepage sections. Each section ID must be unique."
        schema:
          properties:
            section_id:
              label: "Section ID"
              description: "A unique identifier, such as featured or members-only. Use this same ID on the cards belonging to this section. Keep it unchanged to preserve collapse preferences."
            title:
              label: "Section title"
              description: "The heading displayed above this section."
            allowed_groups:
              label: "Allowed groups"
              description: "Leave empty to show this section to everyone. Select groups to show it only to members of at least one selected group. Include staff if they should also have access."

      featured_items:
        description: "Create and reorder featured cards. Each card belongs to the section matching its Section ID."
        schema:
          properties:
            section_id:
              label: "Section ID"
              description: "Enter the exact Section ID configured under featured_sections."
            title:
              label: "Title"
              description: "The title displayed below the card image."
            url:
              label: "URL"
              description: "The URL opened when the card is clicked."
            image:
              label: "Image"
              description: "The image displayed on this card."
            label:
              label: "Label"
              description: "An optional label displayed over the image."
