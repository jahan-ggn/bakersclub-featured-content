en:
  theme_metadata:
    description: "Adds a configurable featured content section to the BakersClub homepage for highlighting articles, guides, and other external content."

    settings:
      section_title: "The title displayed above the featured content section."

      featured_items:
        description: "A list of items to feature in the section. Each item requires a title, URL, and image."
        schema:
          properties:
            title:
              description: "The title displayed for this featured item."
            url:
              description: "The external URL opened when the featured item is clicked."
            image:
              description: "The image displayed for this featured item."
