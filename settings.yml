featured_sections:
  type: objects
  default: []
  schema:
    name: featured_section
    properties:
      section_id:
        type: string
        required: true
      title:
        type: string
        required: true
      allowed_groups:
        type: groups

featured_items:
  type: objects
  default: []
  schema:
    name: featured_item
    properties:
      section_id:
        type: string
        required: true
      title:
        type: string
        required: true
      url:
        type: string
        required: true
        validations:
          url: true
      image:
        type: upload
        required: true
      label:
        type: string
